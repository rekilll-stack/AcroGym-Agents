<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Jost';src:url('file:///home/admin/acrogym/config/brand/fonts/Gerhaus-Regular.otf')}
*{margin:0;padding:0;box-sizing:border-box}
.card{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Jost'}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:saturate(1.4) contrast(1.04) brightness(1.02) sepia(.4) hue-rotate(-12deg)}
/* warm amber wash over whole photo */
.grade{position:absolute;inset:0;background:
  radial-gradient(120% 80% at 50% 30%, rgba(255,170,80,.30), rgba(243,112,33,.10) 55%, rgba(150,55,10,.30));
  mix-blend-mode:soft-light}
.grade2{position:absolute;inset:0;background:linear-gradient(180deg, rgba(243,112,33,.05), rgba(243,112,33,.18));mix-blend-mode:multiply}
/* bottom solid orange ground for text */
.ground{position:absolute;left:0;right:0;bottom:0;height:46%;
  background:linear-gradient(180deg, rgba(243,112,33,0) 0%, rgba(238,98,70,.45) 42%, rgba(243,112,33,.96) 100%)}
.logo{position:absolute;top:46px;left:50%;transform:translateX(-50%);width:210px;
  filter:drop-shadow(0 2px 10px rgba(80,30,5,.5))}
.body{position:absolute;left:80px;right:80px;bottom:230px}
.head{font-weight:700;text-transform:uppercase;color:#FBF1DF;font-size:128px;line-height:.97;
  letter-spacing:.5px;text-shadow:0 4px 22px rgba(110,35,10,.45)}
.cta{position:absolute;left:80px;bottom:120px;display:flex;align-items:center;gap:26px}
.pill{background:#F37021;color:#FBF1DF;font-weight:600;text-transform:uppercase;
  font-size:34px;letter-spacing:1px;padding:20px 40px;border-radius:60px;box-shadow:0 6px 20px rgba(120,40,10,.35)}
.arrow{width:74px;height:6px;background:#F37021;position:relative;border-radius:3px}
.arrow:after{content:'';position:absolute;right:-2px;top:-11px;width:24px;height:24px;
  border-top:6px solid #F37021;border-right:6px solid #F37021;transform:rotate(45deg);border-radius:2px}
</style></head><body>
<div class="card">
  <img class="photo" src="file:///home/admin/acrogym/config/brand/backgrounds/bg-kids-motion.jpg">
  <div class="grade"></div><div class="grade2"></div><div class="ground"></div>
  <img class="logo" src="file:///home/admin/acrogym/config/brand/logo-white.png">
  <div class="body"><div class="head">Enrolment is now open</div></div>
  <div class="cta"><div class="pill">Building skills together</div><div class="arrow"></div></div>
</div>
</body></html>
